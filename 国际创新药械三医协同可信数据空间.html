<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际创新药械“三医协同”可信数据空间</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <!-- Three.js for 3D particle animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- PapaParse for CSV parsing (kept for other potential uses) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- D3.js for new data viewer -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- ECharts (for data-catalog region map) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <style>
        /* Custom styles to complement Tailwind CSS */
        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #f4f8fc;
            scroll-behavior: smooth;
        }
        .hero-gradient {
            background: linear-gradient(120deg, #1e3a8a 0%, #3b82f6 100%);
            position: relative;
            overflow: hidden;
        }
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
        }
        .card-hover-effect {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover-effect:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .section-title {
            font-size: 2.25rem; /* 36px */
            font-weight: 700;
            line-height: 2.5rem; /* 40px */
            color: #1e293b; /* slate-800 */
        }
        .section-subtitle {
            font-size: 1.125rem; /* 18px */
            color: #475569; /* slate-600 */
            margin-top: 1rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .tab-button {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }
        .tab-button.active {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .tab-button:not(.active) {
            color: #475569; /* slate-600 */
        }
        .tab-button:not(.active):hover {
            background-color: #e2e8f0; /* slate-200 */
            color: #1e293b; /* slate-800 */
        }
        .solution-tab-button {
            padding: 0.75rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .solution-tab-button.active {
              background-color: #1e3a8a; /* dark blue */
              color: white;
        }
        .solution-tab-button:not(.active) {
            background-color: rgba(255, 255, 255, 0.95);
            color: #1e40af;
            border: 1px solid #bfdbfe;
            box-shadow: 0 1px 2px 0 rgb(59 130 246 / 0.06);
        }
        .solution-tab-button:not(.active):hover {
            background-color: #e0f2fe;
        }
        .partner-logo {
            transition: all 0.3s ease;
            filter: grayscale(100%);
            opacity: 0.7;
        }
        .partner-logo:hover {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.05);
        }
        /* Timeline styles */
        .timeline-item {
            position: relative;
            padding-left: 2.5rem;
            padding-bottom: 2rem;
            border-left: 2px solid #e2e8f0;
        }
        .timeline-item:last-child {
            border-left: 2px solid transparent;
            padding-bottom: 0;
        }
        .timeline-dot {
            position: absolute;
            left: -0.5625rem;
            top: 0.25rem;
            width: 1.125rem;
            height: 1.125rem;
            background-color: white;
            border: 2px solid #3b82f6;
            border-radius: 9999px;
        }
        /* AI Assistant Styles */
        .chat-bubble-user {
            background-color: #3b82f6; /* blue-500 */
            color: white;
        }
        .chat-bubble-bot {
            background-color: #e2e8f0; /* slate-200 */
            color: #1e293b; /* slate-800 */
        }
        /* Hide elements controlled by Alpine.js until it's initialized */
        [x-cloak] { display: none !important; }
        [hidden] { display: none !important; }

        /* Styles for the new Data Viewer */
        .table-container {
            max-height: 60vh;
            overflow-y: auto;
            overflow-x: auto;
        }
        .resizable-th {
            position: relative;
        }
        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            cursor: col-resize;
            user-select: none;
            height: 100%;
            background-color: transparent;
        }
        .resizer:hover, .resizing {
            background-color: #a0aec0; /* gray-400 */
        }
        .column-toggle-dropdown, .column-filter-dropdown {
            position: absolute;
            z-index: 10;
            background-color: white;
            border: 1px solid #e2e8f0; /* gray-200 */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 0.5rem;
        }
        .column-filter-dropdown {
            width: 250px;
        }
        .filter-options-container {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .filter-button.active svg {
            color: #3b82f6; /* blue-500 */
        }
    </style>
</head>
<body x-data="appData()" x-init="initApp()">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-lg sticky top-0 z-50 shadow-sm" x-data="{ mobileMenuOpen: false }">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <!-- Logo and Title -->
                <div class="flex items-center space-x-3 cursor-pointer" @click="activePage = 'home'">
                    <svg class="h-10 w-10 text-blue-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 11v0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path><path d="M12 14c-2.5 0-4.5 2-4.5 4.5v.5h9v-.5c0-2.5-2-4.5-4.5-4.5z"></path></svg>
                    <span class="text-xl font-bold text-slate-800" x-text="content[lang].header.title"></span>
                </div>
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" @click.prevent="activePage = 'home'" class="text-slate-600 hover:text-blue-600 transition-colors" :class="{ 'text-blue-600 font-semibold': activePage === 'home' }" x-text="content[lang].header.nav.home"></a>
                    <a href="#" @click.prevent="activePage = 'data-catalog'" class="text-slate-600 hover:text-blue-600 transition-colors" :class="{ 'text-blue-600 font-semibold': activePage === 'data-catalog' }" x-text="content[lang].header.nav.dataCatalog"></a>
                    <a href="#" @click.prevent="activePage = 'solutions'" class="text-slate-600 hover:text-blue-600 transition-colors" :class="{ 'text-blue-600 font-semibold': activePage === 'solutions' }" x-text="content[lang].header.nav.solutions"></a>
                    <a href="#" @click.prevent="activePage = 'partners'" class="text-slate-600 hover:text-blue-600 transition-colors" :class="{ 'text-blue-600 font-semibold': activePage === 'partners' }" x-text="content[lang].header.nav.partners"></a>
                    <a href="#" @click.prevent="activePage = 'about'" class="text-slate-600 hover:text-blue-600 transition-colors" :class="{ 'text-blue-600 font-semibold': activePage === 'about' }" x-text="content[lang].header.nav.about"></a>
                </div>
                <!-- Desktop Actions -->
                <div class="hidden md:flex items-center space-x-4">
                    <button class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors" x-text="content[lang].header.login"></button>
                    <div class="flex items-center space-x-1 text-sm">
                        <button @click="setLang('zh')" :class="lang === 'zh' ? 'font-bold text-blue-600' : 'text-slate-500'">中文</button>
                        <span>/</span>
                        <button @click="setLang('en')" :class="lang === 'en' ? 'font-bold text-blue-600' : 'text-slate-500'">EN</button>
                    </div>
                </div>
                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button @click="mobileMenuOpen = !mobileMenuOpen">
                        <i data-lucide="menu" class="w-6 h-6 text-slate-700"></i>
                    </button>
                </div>
            </div>
        </nav>
        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" x-cloak @click.away="mobileMenuOpen = false" class="md:hidden bg-white py-4 px-6">
            <a href="#" @click.prevent="activePage = 'home'; mobileMenuOpen = false" class="block py-2 text-slate-600 hover:text-blue-600" :class="{ 'text-blue-600 font-semibold': activePage === 'home' }" x-text="content[lang].header.nav.home"></a>
            <a href="#" @click.prevent="activePage = 'data-catalog'; mobileMenuOpen = false" class="block py-2 text-slate-600 hover:text-blue-600" :class="{ 'text-blue-600 font-semibold': activePage === 'data-catalog' }" x-text="content[lang].header.nav.dataCatalog"></a>
            <a href="#" @click.prevent="activePage = 'solutions'; mobileMenuOpen = false" class="block py-2 text-slate-600 hover:text-blue-600" :class="{ 'text-blue-600 font-semibold': activePage === 'solutions' }" x-text="content[lang].header.nav.solutions"></a>
            <a href="#" @click.prevent="activePage = 'partners'; mobileMenuOpen = false" class="block py-2 text-slate-600 hover:text-blue-600" :class="{ 'text-blue-600 font-semibold': activePage === 'partners' }" x-text="content[lang].header.nav.partners"></a>
            <a href="#" @click.prevent="activePage = 'about'; mobileMenuOpen = false" class="block py-2 text-slate-600 hover:text-blue-600" :class="{ 'text-blue-600 font-semibold': activePage === 'about' }" x-text="content[lang].header.nav.about"></a>
            <button class="w-full mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors" x-text="content[lang].header.login"></button>
              <div class="flex items-center justify-center space-x-2 text-sm mt-4">
                <button @click="setLang('zh')" :class="lang === 'zh' ? 'font-bold text-blue-600' : 'text-slate-500'">中文</button>
                <span>/</span>
                <button @click="setLang('en')" :class="lang === 'en' ? 'font-bold text-blue-600' : 'text-slate-500'">EN</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Home Page -->
        <div x-show="activePage === 'home'" x-cloak>
            <!-- Hero Section -->
            <section class="hero-gradient text-white">
                <canvas id="particle-canvas"></canvas>
                <div class="hero-content container mx-auto px-6 py-24 md:py-32 text-center">
                    <h1 class="text-4xl md:text-6xl font-bold leading-tight" x-text="content[lang].home.hero.title"></h1>
                    <p class="mt-6 text-lg md:text-xl text-blue-100 max-w-3xl mx-auto" x-text="content[lang].home.hero.subtitle"></p>
                    <div class="mt-10 flex justify-center flex-wrap gap-4">
                        <button @click="activePage = 'data-catalog'" class="bg-white text-blue-700 font-semibold px-8 py-3 rounded-lg hover:bg-blue-50 transition-transform transform hover:scale-105" x-text="content[lang].home.hero.cta1"></button>
                        <button @click="activePage = 'solutions'" class="bg-blue-500/50 text-white font-semibold px-8 py-3 rounded-lg hover:bg-blue-500/80 transition-transform transform hover:scale-105" x-text="content[lang].home.hero.cta2"></button>
                    </div>
                </div>
            </section>

            <!-- Features Section -->
            <section class="py-20 bg-white">
                <div class="container mx-auto px-6">
                    <div class="text-center mb-16">
                        <h2 class="section-title" x-text="content[lang].home.features.title"></h2>
                        <p class="section-subtitle" x-text="content[lang].home.features.subtitle"></p>
                    </div>
                    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        <div class="text-center p-6 bg-slate-50 rounded-xl">
                            <div class="flex items-center justify-center h-16 w-16 rounded-full bg-blue-100 text-blue-600 mx-auto mb-4">
                                <i data-lucide="shield-check" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-xl font-semibold text-slate-800 mb-2" x-text="content[lang].home.features.cards[0].title"></h3>
                            <p class="text-slate-600" x-text="content[lang].home.features.cards[0].description"></p>
                        </div>
                        <div class="text-center p-6 bg-slate-50 rounded-xl">
                            <div class="flex items-center justify-center h-16 w-16 rounded-full bg-blue-100 text-blue-600 mx-auto mb-4">
                                <i data-lucide="file-check-2" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-xl font-semibold text-slate-800 mb-2" x-text="content[lang].home.features.cards[1].title"></h3>
                            <p class="text-slate-600" x-text="content[lang].home.features.cards[1].description"></p>
                        </div>
                        <div class="text-center p-6 bg-slate-50 rounded-xl">
                            <div class="flex items-center justify-center h-16 w-16 rounded-full bg-blue-100 text-blue-600 mx-auto mb-4">
                                <i data-lucide="zap" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-xl font-semibold text-slate-800 mb-2" x-text="content[lang].home.features.cards[2].title"></h3>
                            <p class="text-slate-600" x-text="content[lang].home.features.cards[2].description"></p>
                        </div>
                        <div class="text-center p-6 bg-slate-50 rounded-xl">
                            <div class="flex items-center justify-center h-16 w-16 rounded-full bg-blue-100 text-blue-600 mx-auto mb-4">
                                <i data-lucide="award" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-xl font-semibold text-slate-800 mb-2" x-text="content[lang].home.features.cards[3].title"></h3>
                            <p class="text-slate-600" x-text="content[lang].home.features.cards[3].description"></p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- High-Value Scenarios Section -->
            <section class="py-20">
                <div class="container mx-auto px-6">
                    <div class="text-center mb-16">
                        <h2 class="section-title" x-text="content[lang].home.scenarios.title"></h2>
                        <p class="section-subtitle" x-text="content[lang].home.scenarios.subtitle"></p>
                    </div>
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="bg-white p-8 rounded-xl shadow-md flex items-start space-x-6 card-hover-effect">
                            <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-lg bg-blue-600 text-white">
                                <i data-lucide="file-plus-2" class="w-7 h-7"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-slate-800" x-text="content[lang].home.scenarios.cards[0].title"></h3>
                                <p class="mt-2 text-slate-600" x-text="content[lang].home.scenarios.cards[0].description"></p>
                            </div>
                        </div>
                        <div class="bg-white p-8 rounded-xl shadow-md flex items-start space-x-6 card-hover-effect">
                            <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-lg bg-blue-600 text-white">
                                <i data-lucide="shield-plus" class="w-7 h-7"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-slate-800" x-text="content[lang].home.scenarios.cards[1].title"></h3>
                                <p class="mt-2 text-slate-600" x-text="content[lang].home.scenarios.cards[1].description"></p>
                            </div>
                        </div>
                        <div class="bg-white p-8 rounded-xl shadow-md flex items-start space-x-6 card-hover-effect">
                            <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-lg bg-blue-600 text-white">
                                <i data-lucide="flask-conical" class="w-7 h-7"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-slate-800" x-text="content[lang].home.scenarios.cards[2].title"></h3>
                                <p class="mt-2 text-slate-600" x-text="content[lang].home.scenarios.cards[2].description"></p>
                            </div>
                        </div>
                        <div class="bg-white p-8 rounded-xl shadow-md flex items-start space-x-6 card-hover-effect">
                            <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-lg bg-blue-600 text-white">
                                <i data-lucide="leaf" class="w-7 h-7"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-slate-800" x-text="content[lang].home.scenarios.cards[3].title"></h3>
                                <p class="mt-2 text-slate-600" x-text="content[lang].home.scenarios.cards[3].description"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- CTA Section -->
            <section class="bg-white py-20">
                <div class="container mx-auto px-6 text-center">
                    <h2 class="text-3xl font-bold text-slate-800" x-text="content[lang].home.cta.title"></h2>
                    <p class="mt-4 text-lg text-slate-600 max-w-2xl mx-auto" x-text="content[lang].home.cta.subtitle"></p>
                    <div class="mt-8">
                        <button class="bg-blue-600 text-white font-semibold px-8 py-3 rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105" x-text="content[lang].home.cta.button"></button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Data Catalog Page -->
        <div x-show="activePage === 'data-catalog'" x-cloak>
            <div class="container mx-auto px-6 py-12">
                <div class="text-center mb-12">
                    <h1 class="section-title" x-text="content[lang].dataCatalog.title"></h1>
                    <p class="section-subtitle max-w-4xl" x-text="content[lang].dataCatalog.subtitle"></p>
                </div>

                <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 md:p-12">
                    <!-- Search Bar -->
                    <div class="relative max-w-3xl mx-auto mb-10">
                        <input type="text" x-model.debounce.300ms="searchQuery" :placeholder="content[lang].dataCatalog.searchPlaceholder" class="w-full pl-12 pr-4 py-3 border border-slate-300 rounded-full bg-slate-50 focus:ring-2 focus:ring-blue-400 focus:border-blue-500 text-base md:text-lg transition">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-6 h-6 text-slate-400"></i>
                        </div>
                    </div>

                    <!-- 按数据类型 -->
                    <div class="mb-8">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-x-4 gap-y-2">
                            <span class="font-semibold text-slate-700 flex-shrink-0 w-24 text-left sm:text-right" x-text="content[lang].dataCatalog.regionFilter.typeLabel + ':'"></span>
                            <div class="flex flex-wrap items-center gap-2">
                                <template x-for="t in catalogDataTypeOptions" :key="t">
                                    <button @click="selectCatalogDataType(t)"
                                        :class="{
                                            'bg-blue-600 text-white shadow-sm': selectedCatalogDataType === t,
                                            'bg-slate-100 text-slate-700 hover:bg-slate-200': selectedCatalogDataType !== t
                                        }"
                                        class="px-3 sm:px-4 py-1.5 text-sm rounded-full transition-colors font-medium"
                                        x-text="(content[lang].dataCatalog.regionFilter.typeLabels && content[lang].dataCatalog.regionFilter.typeLabels[t]) || t"></button>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 按区域 -->
                    <div class="mb-10">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="font-semibold text-slate-700" x-text="content[lang].dataCatalog.regionFilter.regionLabel"></span>
                            <span class="text-xs text-slate-400 hidden sm:inline" x-text="content[lang].dataCatalog.regionFilter.regionHint"></span>
                            <button type="button" @click="resetCatalogFilters()" class="ml-auto text-xs text-blue-600 hover:underline" x-text="lang === 'zh' ? '重置筛选' : 'Reset'"></button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <div class="md:col-span-3 relative rounded-2xl border border-blue-100 bg-gradient-to-br from-blue-50/40 to-white">
                                <div id="catalogRegionMap" class="w-full" style="height:420px;min-height:380px;"></div>
                                <div x-show="catalogRegionMapErrorVisible" class="absolute inset-3 flex flex-col items-center justify-center text-slate-500 bg-white/85 rounded-xl border border-dashed border-slate-300" style="display:none;">
                                    <i data-lucide="map-off" class="w-8 h-8 mb-2 text-slate-400"></i>
                                    <p class="text-sm" x-text="content[lang].dataCatalog.regionFilter.mapErrorText"></p>
                                </div>
                            </div>
                            <div class="md:col-span-2 rounded-2xl border border-blue-100 overflow-hidden bg-white">
                                <div class="px-4 py-2 bg-gradient-to-r from-blue-50 to-blue-100 flex items-center justify-between">
                                    <span class="text-sm font-semibold text-slate-700" x-text="content[lang].dataCatalog.regionFilter.tableTitle"></span>
                                    <span class="text-xs text-slate-500"><span x-text="filteredCatalogRegionResources.length"></span> <span x-text="content[lang].dataCatalog.regionFilter.countSuffix"></span></span>
                                </div>
                                <div class="overflow-y-auto" style="max-height:380px">
                                    <table class="w-full text-left text-sm">
                                        <thead class="bg-slate-50 sticky top-0">
                                            <tr>
                                                <th class="px-3 py-2 font-medium text-slate-500" x-text="content[lang].dataCatalog.regionFilter.tableHeaderRegion"></th>
                                                <th class="px-3 py-2 font-medium text-slate-500" x-text="content[lang].dataCatalog.regionFilter.tableHeaderTypes"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="r in filteredCatalogRegionResources" :key="r.region">
                                                <tr @click="selectCatalogRegion(r.region)"

            '内蒙古自治区': '内蒙古', '广西壮族自治区': '广西', '西藏自治区': '西藏',
            '宁夏回族自治区': '宁夏', '新疆维吾尔自治区': '新疆',
            '香港特别行政区': '香港', '澳门特别行政区': '澳门'
        };

        function _normalizeChinaGeoJson(geoJson) {
            if (!geoJson || !geoJson.features) return geoJson;
            geoJson.features.forEach(function(f) {
                if (f.properties && f.properties.name && CATALOG_PROVINCE_NAME_MAP[f.properties.name]) {
                    f.properties.name = CATALOG_PROVINCE_NAME_MAP[f.properties.name];
                }
            });
            return geoJson;
        }

        function _loadCatalogScript(src, timeout) {
            timeout = timeout || 8000;
            return new Promise(function(resolve, reject) {
                const sc = document.createElement('script');
                let done = false;
                const tm = setTimeout(function() { if (done) return; done = true; sc.remove(); reject(new Error('timeout')); }, timeout);
                sc.onload = function() { if (done) return; done = true; clearTimeout(tm); resolve(); };
                sc.onerror = function() { if (done) return; done = true; clearTimeout(tm); reject(new Error('error')); };
                sc.src = src;
                document.head.appendChild(sc);
            });
        }

        async function loadChinaMapForCatalog() {
            if (typeof echarts === 'undefined') return false;
            if (echarts.getMap && echarts.getMap('china')) return true;
            const scriptSources = [
                'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js',
                'https://fastly.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js',
                'https://unpkg.com/echarts@4.9.0/map/js/china.js'
            ];
            for (let i = 0; i < scriptSources.length; i++) {
                try {
                    await _loadCatalogScript(scriptSources[i]);
                    if (echarts.getMap && echarts.getMap('china')) return true;
                } catch (e) { /* try next */ }
            }
            const jsonSources = [
                'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
                'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json',
                'https://unpkg.com/echarts@4.9.0/map/json/china.json'
            ];
            for (let i = 0; i < jsonSources.length; i++) {
                try {
                    const r = await fetch(jsonSources[i]);
                    if (!r.ok) continue;
                    const j = await r.json();
                    if (!j || !j.features) continue;
                    _normalizeChinaGeoJson(j);
                    echarts.registerMap('china', j);
                    return true;
                } catch (e) { /* try next */ }
            }
            return false;
        }

                initApp() {
                    this.activeDomain = this.content[this.lang].dataCatalog.filters.domain.options[0];
                    this.activeApp = this.content[this.lang].dataCatalog.filters.application.options[0];
                    this.activeDisease = this.content[this.lang].dataCatalog.filters.disease.options[0];

                    // Watch for page changes: re-render icons + lazy init catalog map + resize
                    this.$watch('activePage', () => {
                        this.$nextTick(() => {
                            try { lucide.createIcons(); } catch (e) {}

                                this.initCatalogMap();
                                if (this.catalogRegionMapChart) {
                                    try { this.catalogRegionMapChart.resize(); } catch (e) {}

                        });
                    });
                    // Set initial welcome message for AI assistant
                    this.setLang(this.lang);

                    // If default page is data-catalog, init map after Alpine renders DOM
                    if (this.activePage === 'data-catalog') {
                        this.$nextTick(() => this.initCatalogMap());
                    }
                },
                
                get filteredDatasets() {
                    const allDatasets = Object.entries(this.content[this.lang].dataCatalog.cards).map(([key, value]) => ({
                        key: key,
                        ...value
                    }));

                    const query = this.searchQuery.trim().toLowerCase();
                    const escapedQuery = this.searchQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const highlight = (text) => {
                        if (!query || !text) return text;
                        const regex = new RegExp('(' + escapedQuery + ')', 'gi');
                        return text.replace(regex, '<mark class="bg-yellow-200 px-0.5 rounded-sm">$1</mark>');
                    };

                    return allDatasets
                        .filter(d => {
                            if (!query) return true;
                            const tagsHay = (d.tags || []).join(' ').toLowerCase();
                            return d.title.toLowerCase().includes(query)
                                || (d.description && d.description.toLowerCase().includes(query))
                                || (d.provider && d.provider.toLowerCase().includes(query))
                                || tagsHay.includes(query);
                        })
                        .map(d => ({
                            ...d,
                            highlightedTitle: highlight(d.title),
                            highlightedDescription: highlight(d.description),
                        }));
                },

                // === Catalog (region map + table) helpers ===
                get filteredCatalogRegionResources() {
                    const type = this.selectedCatalogDataType;
                    const query = this.searchQuery.trim().toLowerCase();
                    return this.catalogRegionResources.filter(r => {
                        const matchType = type === '全部' || r.types.includes(type);
                        if (!matchType) return false;
                        if (!query) return true;
                        return [r.region, r.displayName, r.province, ...r.types, ...r.resources]
                            .join(' ').toLowerCase().includes(query);
                    });
                },

                getCatalogTypeStyle(t) {
                    return this.catalogTypeStyles[t] || { bg: '#e2e8f0', text: '#334155', border: '#cbd5e1' };
                },

                selectCatalogDataType(t) {
                    this.selectedCatalogDataType = t;
                    this.selectedCatalogRegion = null;
                    this.$nextTick(() => this.updateCatalogMap());
                },

                selectCatalogRegion(r) {
                    this.selectedCatalogRegion = (this.selectedCatalogRegion === r) ? null : r;
                    this.$nextTick(() => this.updateCatalogMap());
                },

                resetCatalogFilters() {
                    this.selectedCatalogDataType = '全部';
                    this.selectedCatalogRegion = null;
                    this.searchQuery = '';
                    this.$nextTick(() => this.updateCatalogMap());
                },

                async initCatalogMap() {
                    if (this._catalogMapInited) return;
                    this._catalogMapInited = true;
                    try {
                        if (typeof echarts === 'undefined') {
                            this.catalogRegionMapErrorVisible = true;
                            return;
                        }
                        const el = document.getElementById('catalogRegionMap');
                        if (!el) { this._catalogMapInited = false; return; }
                        this.catalogRegionMapChart = echarts.init(el);
                        this.catalogRegionMapChart.showLoading('default', { text: this.lang === 'zh' ? '加载地图...' : 'Loading map...', color: '#2563eb', textColor: '#1d4ed8', maskColor: 'rgba(255,255,255,0.7)' });
                        const ok = await loadChinaMapForCatalog();
                        this.catalogRegionMapChart.hideLoading();
                        if (!ok) {
                            this.catalogRegionMapErrorVisible = true;
                            return;
                        }
                        this.catalogRegionMapAvailable = true;
                        const self = this;
                        this.catalogRegionMapChart.on('click', function(params) {
                            if (params.seriesType === 'effectScatter' && params.data && params.data.region) {
                                self.selectCatalogRegion(params.data.region.region);
                                return;
                            }
                            if (params.seriesType === 'map') {
                                const inProvince = self.catalogRegionResources.filter(r => r.province === params.name).map(r => r.region);
                                if (inProvince.length > 0) self.selectCatalogRegion(inProvince[0]);
                            }
                        });
                        window.addEventListener('resize', function() {
                            try { if (self.catalogRegionMapChart) self.catalogRegionMapChart.resize(); } catch (e) {}
                        });
                        this.updateCatalogMap();
                    } catch (e) {
                        console.error('[CatalogMap] init failed:', e);
                        this.catalogRegionMapErrorVisible = true;
                    }
                },

                updateCatalogMap() {
                    if (!this.catalogRegionMapChart || !this.catalogRegionMapAvailable) return;
                    const items = this.filteredCatalogRegionResources;
                    const provinceMap = new Map();
                    items.forEach(item => {
                        if (!provinceMap.has(item.province)) {
                            provinceMap.set(item.province, { province: item.province, regions: [], types: new Set(), resources: [] });
                        }
                        const e = provinceMap.get(item.province);
                        e.regions.push(item);
                        item.types.forEach(t => e.types.add(t));
                        item.resources.forEach(r => e.resources.push(r));
                    });
                    const mapData = Array.from(provinceMap.values()).map(p => ({
                        name: p.province,
                        value: 60 + p.regions.length * 10,
                        types: Array.from(p.types),
                        regions: p.regions.map(r => r.displayName),
                        resources: Array.from(new Set(p.resources))
                    }));
                    const sel = this.selectedCatalogRegion;
                    const TYPE_STYLES = this.catalogTypeStyles;
                    const scatterData = items.map(r => ({
                        name: r.region,
                        value: [r.coordinate[0], r.coordinate[1], 100],
                        region: r,
                        symbolSize: sel === r.region ? 16 : 8,
                        itemStyle: {
                            color: sel === r.region ? '#1d4ed8' : '#2563eb',
                            shadowBlur: sel === r.region ? 24 : 14,
                            shadowColor: '#3b82f6'
                        }
                    }));
                    try {
                        this.catalogRegionMapChart.setOption({
                            backgroundColor: 'transparent',
                            tooltip: {
                                trigger: 'item',
                                backgroundColor: 'rgba(255,255,255,0.96)',
                                borderColor: '#bfdbfe',
                                textStyle: { color: '#0f172a' },
                                formatter: function(params) {
                                    if (params.seriesType === 'effectScatter' && params.data && params.data.region) {
                                        const r = params.data.region;
                                        const tagsHtml = r.types.map(function(t) {
                                            const sty = TYPE_STYLES[t] || { bg:'#e2e8f0', text:'#334155', border:'#cbd5e1' };
                                            return '<span style="display:inline-block;padding:1px 7px;margin:2px 3px 0 0;border-radius:6px;font-size:11px;background:' + sty.bg + ';color:' + sty.text + ';border:1px solid ' + sty.border + '">' + t + '</span>';
                                        }).join('');
                                        return '<div style="padding:6px 8px;min-width:180px"><div style="font-size:13px;font-weight:bold;color:#1d4ed8;margin-bottom:4px">' + r.displayName + '</div><div style="font-size:11px;color:#64748b;margin-bottom:2px">数据类型</div><div style="margin-bottom:4px">' + tagsHtml + '</div><div style="font-size:11px;color:#64748b;">资源：' + r.resources.join('、') + '</div></div>';
                                    }
                                    if (params.seriesType === 'map' && params.data && params.data.types) {
                                        const d = params.data;
                                        const tagsHtml = d.types.map(function(t) {
                                            const sty = TYPE_STYLES[t] || { bg:'#e2e8f0', text:'#334155', border:'#cbd5e1' };
                                            return '<span style="display:inline-block;padding:1px 7px;margin:2px 3px 0 0;border-radius:6px;font-size:11px;background:' + sty.bg + ';color:' + sty.text + ';border:1px solid ' + sty.border + '">' + t + '</span>';
                                        }).join('');
                                        return '<div style="padding:6px 8px;min-width:200px"><div style="font-size:13px;font-weight:bold;color:#1d4ed8;margin-bottom:4px">' + params.name + '</div><div style="font-size:11px;color:#64748b;margin-bottom:2px">已对接城市（' + d.regions.length + '）</div><div style="font-size:11px;color:#0f172a;margin-bottom:4px">' + d.regions.join('、') + '</div><div style="font-size:11px;color:#64748b;margin-bottom:2px">数据类型</div><div>' + tagsHtml + '</div></div>';
                                    }
                                    return '<div style="padding:4px 8px;font-size:12px"><strong>' + params.name + '</strong><span style="color:#64748b;margin-left:6px">暂未接入</span></div>';
                                }
                            },
                            visualMap: { min: 50, max: 120, show: false, inRange: { color: ['#bfdbfe', '#60a5fa', '#1d4ed8'] } },
                            geo: {
                                map: 'china', roam: true, zoom: 1.1,
                                scaleLimit: { min: 0.8, max: 2.5 },
                                label: { show: false },
                                itemStyle: { areaColor: '#eff6ff', borderColor: '#93c5fd', borderWidth: 0.8 },
                                emphasis: {
                                    label: { show: true, color: '#1d4ed8', fontWeight: 'bold', fontSize: 11 },
                                    itemStyle: { areaColor: '#60a5fa' }
                                }
                            },
                            series: [
                                {
                                    name: '已合作区域',
                                    type: 'map', map: 'china', geoIndex: 0, data: mapData,
                                    label: { show: false },
                                    emphasis: {
                                        label: { show: true, color: '#fff', fontWeight: 'bold', fontSize: 11 },
                                        itemStyle: { areaColor: '#2563eb' }
                                    }
                                },
                                {
                                    name: '资源点',
                                    type: 'effectScatter', coordinateSystem: 'geo',
                                    rippleEffect: { scale: 4, brushType: 'stroke' },
                                    symbolSize: 8,
                                    itemStyle: { color: '#2563eb', shadowBlur: 14, shadowColor: '#3b82f6' },
                                    data: scatterData,
                                    z: 5
                                }
                            ]
                        }, { notMerge: true });
                    } catch (e) {
                        console.error('[CatalogMap] setOption failed:', e);
                    }
                },

                // Method to send a user message in the chat
                sendMessage() {
                    if (!this.userInput.trim()) return;
                    this.messages.push({ role: 'user', text: this.userInput });
                    this.getBotResponse(this.userInput);
                    this.userInput = '';
                    this.$nextTick(() => { this.scrollToBottom(); });
                },

        document.addEventListener('DOMContentLoaded', () => {
            // Initial call to render Lucide icons on the default page
            lucide.createIcons();
            
            // Dynamically set the copyright year
            const copyrightYearEl = document.getElementById('copyright-year');
            if (copyrightYearEl) {
                copyrightYearEl.textContent = new Date().getFullYear();
            }

            // --- Three.js Particle Animation Script ---
            const heroSection = document.querySelector('.hero-gradient');
            if (heroSection) {
                let scene, camera, renderer, particles;
                let mouseX = 0, mouseY = 0;
                let windowHalfX = window.innerWidth / 2;
                let windowHalfY = window.innerHeight / 2;
                
                function init() {
                    const canvas = document.getElementById('particle-canvas');
                    
                    // Set up the camera
                    camera = new THREE.PerspectiveCamera(75, heroSection.offsetWidth / heroSection.offsetHeight, 1, 10000);
                    camera.position.z = 1000;

                    // Set up the scene
                    scene = new THREE.Scene();

                    // Set up the renderer
                    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
                    renderer.setSize(heroSection.offsetWidth, heroSection.offsetHeight);
                    renderer.setClearColor(0x000000, 0); // Transparent background

                    // Create particles
                    const particlesCount = 5000;
                    const positions = new Float32Array(particlesCount * 3);
                    const colors = new Float32Array(particlesCount * 3);
                    const color = new THREE.Color();

                    for (let i = 0; i < particlesCount; i++) {
                        const x = Math.random() * 2000 - 1000;
                        const y = Math.random() * 2000 - 1000;
                        const z = Math.random() * 2000 - 1000;

                        positions[i * 3] = x;
                        positions[i * 3 + 1] = y;
                        positions[i * 3 + 2] = z;
                        
                        // Set particle color (shades of white and light blue)
                        color.setHSL(0.6, 0.9, Math.random() * 0.5 + 0.5);
                        colors[i * 3] = color.r;
                        colors[i * 3 + 1] = color.g;
                        colors[i * 3 + 2] = color.b;
                    }

                    // Create buffer geometry
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                    // Create material
                    const material = new THREE.PointsMaterial({
                        size: 2,
                        vertexColors: true,
                        blending: THREE.AdditiveBlending,
                        transparent: true,
                        opacity: 0.8
                    });

                    particles = new THREE.Points(geometry, material);
                    scene.add(particles);

                    // Add event listeners
                    document.addEventListener('mousemove', onDocumentMouseMove, false);
                    window.addEventListener('resize', onWindowResize, false);
                }

                function onWindowResize() {
                    windowHalfX = window.innerWidth / 2;
                    windowHalfY = window.innerHeight / 2;
                    camera.aspect = heroSection.offsetWidth / heroSection.offsetHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(heroSection.offsetWidth, heroSection.offsetHeight);
                }

                function onDocumentMouseMove(event) {
                    mouseX = event.clientX - windowHalfX;
                    mouseY = event.clientY - windowHalfY;
                }

                function animate() {
                    requestAnimationFrame(animate);
                    render();
                }

                function render() {
                    const time = Date.now() * 0.00005;

                    // Move camera based on mouse position for a parallax effect
                    camera.position.x += (mouseX - camera.position.x) * 0.05;
                    camera.position.y += (-mouseY - camera.position.y) * 0.05;
                    camera.lookAt(scene.position);
                    
                    // Animate particles rotation
                    particles.rotation.x = time * 0.2;
                    particles.rotation.y = time * 0.4;

                    renderer.render(scene, camera);
                }

                init();
                animate();
            }
        });
    </script>
